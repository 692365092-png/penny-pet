name: Build single-file Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read product version
        shell: powershell
        run: |
          [xml]$props = Get-Content -LiteralPath `
            "$env:GITHUB_WORKSPACE\desktop-pet\ProductVersion.props" -Raw
          $version = [string]$props.Project.PropertyGroup.PennyVersionPrefix
          if ($version -notmatch '^\d+\.\d+$') {
            throw "ProductVersion.props contains an invalid product version."
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            "PENNY_PRODUCT_VERSION=$version" + [Environment]::NewLine,
            (New-Object Text.UTF8Encoding($false)))

      - name: Build solution
        shell: powershell
        run: dotnet build "$env:GITHUB_WORKSPACE\PennyPet.sln" --configuration Release

      - name: Run discoverable core tests
        shell: powershell
        run: dotnet test "$env:GITHUB_WORKSPACE\desktop-pet\PennyPet.Tests.csproj" --configuration Release --no-build

      - name: Run modular self-tests
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP "penny-modular-selftest.json"
          $hostExe = Join-Path $env:GITHUB_WORKSPACE `
            "desktop-pet\bin\Release\net48\PennyPet.SelfTests.exe"
          & $hostExe ("--self-test=" + $report)
          if ($LASTEXITCODE -ne 0) {
            throw "Modular Penny self-test host failed with exit code $LASTEXITCODE."
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) {
            throw "Modular Penny self-tests failed."
          }

      - name: Build one EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release" | Out-Null
          $releaseExe = Join-Path "$env:GITHUB_WORKSPACE\release" `
            "Penny-pet-Windows.exe"
          & "$env:GITHUB_WORKSPACE\desktop-pet\build.ps1" `
            -TargetPlatform anycpu `
            -OutputFile $releaseExe

      - name: Run Penny self-tests
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP "penny-selftest.json"
          $releaseExe = Join-Path "$env:GITHUB_WORKSPACE\release" `
            "Penny-pet-Windows.exe"
          $expectedAssemblyVersion = $env:PENNY_PRODUCT_VERSION + ".0.0"
          $builtVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            $releaseExe)
          if ($builtVersion.FileVersion -ne $expectedAssemblyVersion -or
              $builtVersion.ProductVersion -ne $expectedAssemblyVersion) {
            throw "Release version does not match ProductVersion.props."
          }
          & $releaseExe ("--self-test=" + $report)
          $deadline = [DateTime]::UtcNow.AddMinutes(5)
          while (-not (Test-Path -LiteralPath $report -PathType Leaf) -and
                 [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw "Penny self-test report was not created."
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) {
            throw "Penny self-tests failed."
          }

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release
          format: spdx-json
          output-file: release/Penny-pet.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $checksumFile = Join-Path $releaseDir "SHA256SUMS.txt"
          $lines = Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object Name -ne "SHA256SUMS.txt" |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              $hash.Hash + "  " + $_.Name
            }
          Set-Content -LiteralPath $checksumFile -Value $lines `
            -Encoding ASCII

      - name: Upload single-file EXE
        uses: actions/upload-artifact@v4
        with:
          name: Penny-pet-Windows
          path: |
            release/Penny-pet-Windows.exe
            release/Penny-pet.spdx.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download tested release files
        uses: actions/download-artifact@v4
        with:
          name: Penny-pet-Windows
          path: release

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File |
            ForEach-Object FullName)
          if ($assets.Count -eq 0) {
            throw "No release files were downloaded."
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title ("Penny pet " + $env:GITHUB_REF_NAME) `
            --generate-notes
